<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>おばけ探偵事務所</title>
  <link rel="icon" href="/static/ghost.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/ghost.svg" alt="" class="brand-logo">
      <div>
        <div class="brand-name">おばけ探偵事務所</div>
        <div class="brand-sub">横断調査AIチャット</div>
      </div>
    </div>
    <button id="new-chat" class="new-chat" type="button">新しい調査</button>
    <input id="search" class="search" type="search" placeholder="過去の調査を探す" title="タイトルと中身（質問・回答・調査の記録）から探します。空白で区切るとAND、tag:名前 でタグ">
    <nav id="conversations" class="conversations"></nav>
    <button id="toggle-archive" class="quiet archive-toggle" type="button">アーカイブを見る</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="conversation-head">
        <h1 id="conversation-title" class="conversation-title">新しい調査</h1>
        <div id="conversation-tags" class="tags"></div>
      </div>
      <button id="archive" class="quiet" type="button" hidden>アーカイブ</button>
      <span id="model" class="model" title="設定中のモデル">…</span>
      <button id="open-status" class="quiet" type="button">接続確認</button>
      <button id="open-characters" class="quiet" type="button">キャラクター</button>
    </header>

    <main id="log" class="log"></main>

    <form id="form" class="composer">
      <textarea id="input" rows="1" placeholder="聞きたいことを入力（Enterで送信 / Shift+Enterで改行）"></textarea>
      <div class="composer-bar">
        <span class="composer-label">調べる場所</span>
        <div id="sources" class="sources"></div>
        <button id="send" class="send" type="submit">調査を依頼</button>
      </div>
    </form>
  </div>

  <dialog id="characters">
    <div class="dialog-head">
      <h2>キャラクター</h2>
      <button id="close-characters" class="close" type="button" title="閉じる">×</button>
    </div>
    <p class="dialog-note">所長と所員の名前と性格（口調や得意なこと）を変えられます。変更は次の質問から反映されます。</p>
    <div id="character-list" class="character-list"></div>
  </dialog>

  <dialog id="status">
    <div class="dialog-head">
      <h2>接続確認</h2>
      <button id="close-status" class="close" type="button" title="閉じる">×</button>
    </div>
    <p class="dialog-note">LLMと各ソースに実際につないで、設定が正しいか確かめます。設定は .env に書き、書き換えたらアプリを再起動します。</p>
    <table id="status-table" class="status-table"></table>
    <div class="dialog-actions">
      <button id="run-check" class="primary" type="button">確認する</button>
    </div>
  </dialog>

  <dialog id="scope">
    <div class="dialog-head">
      <h2 id="scope-title">調べる範囲</h2>
      <button id="close-scope" class="close" type="button" title="閉じる">×</button>
    </div>
    <p id="scope-note" class="dialog-note"></p>
    <input id="scope-filter" class="search" type="search" placeholder="名前で絞り込む">
    <div id="scope-list" class="scope-list"></div>
    <div class="dialog-actions">
      <button id="scope-clear" class="quiet" type="button">選択を外す（すべて調べる）</button>
      <button id="scope-done" class="primary" type="button">決定</button>
    </div>
  </dialog>

  <dialog id="trace" class="wide">
    <div class="dialog-head">
      <h2>LLMとのやりとり</h2>
      <button id="close-trace" class="close" type="button" title="閉じる">×</button>
    </div>
    <p id="trace-summary" class="dialog-note"></p>
    <div id="trace-list" class="calls"></div>
  </dialog>

  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
